name: Build & Publish Flutter Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Flutter APK & Publish Release
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        working-directory: coachflow_app
        run: flutter pub get

      - name: 🔨 Build Flutter Android APK (Release)
        working-directory: coachflow_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: 📦 Prepare APK Asset for Release
        id: prepare_asset
        run: |
          BUILD_NUM="${{ github.run_number }}"
          RELEASE_TAG="v1.0.${BUILD_NUM}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          fi
          
          APK_SOURCE="coachflow_app/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            APK_SOURCE="coachflow_app/build/app/outputs/flutter-apk/app-debug.apk"
          fi
          
          APK_NAME="CoachFlow-Flutter-Gateway-${RELEASE_TAG}.apk"
          cp "$APK_SOURCE" "$APK_NAME"
          echo "tag_name=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "apk_path=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: coachflow-flutter-apk
          path: ${{ steps.prepare_asset.outputs.apk_path }}
          retention-days: 1
          if-no-files-found: warn

      - name: 🚀 Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.prepare_asset.outputs.tag_name }}
          name: "CoachFlow Flutter Android App & SMS Gateway ${{ steps.prepare_asset.outputs.tag_name }}"
          draft: false
          prerelease: false
          files: ${{ steps.prepare_asset.outputs.apk_path }}
          body: |
            ## 📱 CoachFlow Flutter Android Companion & SMS Gateway (${{ steps.prepare_asset.outputs.tag_name }})
            
            Official Flutter Android release for **[CoachFlow SaaS](https://ihut.shop/)**.
            
            ---
            
            ### ✨ Features:
            - **🌐 Web Administration Portal**: Embedded WebView for complete coaching management.
            - **📡 10-Second Outbox Queue Polling**: Auto-fetches pending SMS from `/api/sms/:coaching_center_id` every 10 seconds.
            - **📶 SIM 1 Direct SMS Transmission**: Native Android `SmsManager` routing with ৳0.00 internet SMS cost.
            - **📊 Live Node Monitoring**: Real-time battery indicator, daily safety quotas, countdown timer, and live transmission logs.
            - **⚡ REST API Documentation**: Interactive cURL guides for external SMS triggers.
            
            ---
            
            ### 📥 Download & Install:
            - **File**: `${{ steps.prepare_asset.outputs.apk_path }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
